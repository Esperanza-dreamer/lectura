<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>Lectura de Espe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* 主题变量（默认浅绿） */
    body {
      --bg-body: #F7F5F0;
      --bg-card: #FFFFFF;
      --border-color: #E9E2D9;
      --accent: #3A6B5B;
      --accent-light: #EBE7E0;
      --text-color: #2C2A29;
      background-color: var(--bg-body);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: var(--text-color);
      line-height: 1.65;
      transition: background-color 0.2s, color 0.2s;
    }
    /* 蓝色主题 */
    body.theme-blue {
      --bg-body: #EFF3F6;
      --bg-card: #FFFFFF;
      --border-color: #D0E0EB;
      --accent: #2C6C9E;
      --accent-light: #E2ECF3;
    }
    /* 暖橙主题 */
    body.theme-terracotta {
      --bg-body: #FDF6EC;
      --bg-card: #FFFFFF;
      --border-color: #F0E2D0;
      --accent: #B85C2A;
      --accent-light: #F5E6DC;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 3rem;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .logo-area h1 {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--accent), #1F4E3F);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .logo-area p {
      font-size: 0.75rem;
      color: #8A7F74;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .reading-controls {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .font-selector, .theme-btn, .size-btn {
      background: var(--bg-card);
      border-radius: 40px;
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 450;
      cursor: pointer;
      font-family: inherit;
      color: var(--text-color);
      transition: all 0.2s;
    }
    .font-selector:hover, .theme-btn:hover, .size-btn:hover {
      border-color: var(--accent);
      background-color: var(--accent-light);
    }
    .progress-badge {
      font-size: 0.85rem;
      background: var(--accent-light);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      color: var(--accent);
      font-weight: 450;
    }
    .book-header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .book-meta h2 {
      font-size: 1.7rem;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: #1F2E28;
    }
    .book-meta .author {
      font-size: 0.9rem;
      color: #8A7F74;
      margin-top: 0.25rem;
    }
    .chapter-nav {
      display: flex;
      gap: 0.6rem;
    }
    .chapter-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 450;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-color);
    }
    .chapter-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
    }
    .reading-area {
      background: var(--bg-card);
      border-radius: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.03);
      padding: 3rem 3.5rem;
      margin-bottom: 2rem;
      transition: all 0.2s;
    }
    /* 字号控制 */
    .reading-area.text-small .sentence,
    .reading-area.text-small .word {
      font-size: 0.9rem;
    }
    .reading-area.text-normal .sentence,
    .reading-area.text-normal .word {
      font-size: 1.1rem;
    }
    .reading-area.text-large .sentence,
    .reading-area.text-large .word {
      font-size: 1.4rem;
    }
    .sentence {
      display: inline-block;
      line-height: 1.8;
      margin: 0.2rem 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 0.1rem 0.2rem;
      transition: background 0.1s ease;
    }
    .sentence:hover {
      background-color: #FDF6E3;
    }
    .word {
      display: inline-block;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 1px;
      transition: background 0.1s ease;
    }
    .word:hover {
      background-color: #E8F0FE;
    }
    /* 弹窗样式 */
    .translation-tooltip {
      position: absolute;
      background: #2F3E38;
      color: #FEF6E8;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 0.75rem 1rem;
      border-radius: 20px;
      max-width: 360px;
      min-width: 200px;
      white-space: normal;
      word-break: break-word;
      z-index: 120;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      font-family: 'Inter', system-ui, sans-serif;
      backdrop-filter: blur(2px);
    }
    .translation-tooltip::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 20px;
      width: 12px;
      height: 12px;
      background: #2F3E38;
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .tooltip-word {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 4px;
    }
    .tooltip-def {
      margin: 8px 0;
      line-height: 1.4;
    }
    .tooltip-btn {
      background: #5A7A6A;
      border: none;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .tooltip-btn:hover {
      background: #3E5C4E;
    }
    .tooltip-btn-added {
      background: #4A6A5A;
      opacity: 0.7;
      cursor: default;
    }
    .tooltip-btn-added:hover {
      background: #4A6A5A;
    }
    .paragraph {
      margin-bottom: 1.5rem;
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .mark-btn {
      background: var(--accent-light);
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .mark-btn.completed {
      background: var(--accent);
      color: white;
    }
    .status-message {
      font-size: 0.85rem;
      color: #7F6E5D;
    }
    .book-shelf {
      margin-top: 3rem;
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }
    .shelf-title {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-bottom: 1rem;
      color: #6A5C4E;
    }
    .author-group {
      margin-bottom: 1.8rem;
    }
    .author-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.5rem 0;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 0.75rem;
    }
    .author-group-header h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .author-group-header .toggle-icon {
      font-size: 0.9rem;
      color: #9AAD9F;
      transition: transform 0.2s;
    }
    .author-group-header .group-progress {
      font-size: 0.7rem;
      background: var(--accent-light);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      color: var(--accent);
    }
    .author-works {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding-left: 1.5rem;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .author-works.collapsed {
      display: none;
    }
    .book-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 450;
      color: var(--text-color);
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .book-card.read-status {
      background: var(--accent-light);
      border-color: var(--accent);
    }
    .book-card .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 10px;
      display: inline-block;
    }
    .loading-indicator {
      text-align: center;
      padding: 3rem;
      color: #8A7F74;
    }
    @media (max-width: 700px) {
      .app {
        padding: 1rem;
      }
      .reading-area {
        padding: 1.8rem;
      }
      .reading-controls {
        gap: 0.5rem;
      }
    }
    /* 字体选项 */
    .font-serif {
      font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
    }
    .font-sans {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
    }
    .font-times {
      font-family: 'Times New Roman', Times, serif;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="app" id="appRoot">
  <div class="navbar">
    <div class="logo-area">
      <h1>📖 Lectura de Espe</h1>
      <p>Lectura inmersiva · Latinoamérica y España</p>
    </div>
    <div class="reading-controls">
      <select id="fontSwitcher" class="font-selector">
        <option value="font-sans">简约无衬线 · Sans</option>
        <option value="font-serif">优雅衬线 · Serif</option>
        <option value="font-mono">质感等宽 · Mono</option>
        <option value="font-times">经典罗马 · Times</option>
      </select>
      <button id="textSmallBtn" class="size-btn" style="font-size:0.8rem;">A-</button>
      <button id="textNormalBtn" class="size-btn" style="font-size:1rem; font-weight:bold;">A</button>
      <button id="textLargeBtn" class="size-btn" style="font-size:1.2rem;">A+</button>
      <button id="themeDefaultBtn" class="theme-btn">🌿 浅绿</button>
      <button id="themeBlueBtn" class="theme-btn">💧 蓝</button>
      <button id="themeTerracottaBtn" class="theme-btn">🔥 橙</button>
      <span class="progress-badge" id="globalProgressBadge">📚 阅读进度 0%</span>
      <button id="vocabBtn" class="chapter-btn" style="background:var(--accent); color:white; border:none;">📖 单词本 (<span id="vocabCount">0</span>)</button>
    </div>
  </div>

  <div class="book-header">
    <div class="book-meta">
      <h2 id="bookTitle">El instante / 瞬息</h2>
      <div class="author" id="bookAuthor">Jorge Luis Borges</div>
    </div>
    <div class="chapter-nav">
      <button class="chapter-btn" id="prevChapterBtn">◀ 上一章</button>
      <span style="padding:0 0.2rem; font-size:0.9rem; color:#8d7f6f;" id="chapterCounter">第1首</span>
      <button class="chapter-btn" id="nextChapterBtn">下一章 ▶</button>
    </div>
  </div>

  <div class="reading-area" id="readingContainer">
    <div style="text-align: center; color:#B9AFA2;">Cargando...</div>
  </div>

  <div class="action-bar">
    <button class="mark-btn" id="markChapterBtn">✅ 标记本章读完</button>
    <div class="status-message" id="readingStatusMsg">✨ 点击单词查询释义/整句翻译</div>
  </div>

  <div class="book-shelf">
    <div class="shelf-title">📚 我的书桌</div>
    <div id="bookShelfList"></div>
  </div>
</div>

<script>
  // ============================================================
  // 静态作品数据（完整保留：博尔赫斯、聂鲁达、洛尔迦、帕斯）

        { sentences: [{ spanish: "Entre el alba y la noche hay un abismo", chinese: "黎明与黑夜之间有个深渊" },{ spanish: "de agonías, de luces, de cuidados;", chinese: "属于痛苦，属于光亮与忧惧" },{ spanish: "el rostro que se mira en los gastados", chinese: "那张注视的脸孔在黑夜" },{ spanish: "espejos de la noche no es el mismo.", chinese: "磨损的镜中已并非同一。" }] },
        { sentences: [{ spanish: "El hoy fugaz es tenue y es eterno;", chinese: "转瞬的今日纤弱而永恒" },{ spanish: "otro Cielo no esperes, ni otro Infierno.", chinese: "别期望另有天堂，或另有地狱。" }] }
      ]}]
    },
    "1964": {
      author: "Jorge Luis Borges",
      type: "诗歌",
      mode: "sentence",
      chapters: [
        { title: "I", paragraphs: [{ sentences: [{ spanish: "Ya no es mágico el mundo. Te han dejado.", chinese: "世界已不再神奇。他们已远去。" },{ spanish: "Ya no compartirás la clara luna", chinese: "不再与你分享明月" },{ spanish: "ni los lentos jardines. Ya no hay una", chinese: "并那些柔缓的花园。不再有" },{ spanish: "luna que no sea espejo del pasado,", chinese: "那月亮如过往之镜" }] },{ sentences: [{ spanish: "cristal de soledad, sol de agonías.", chinese: "孤独之水晶，苦闷之太阳。" },{ spanish: "Adiós las mutuas manos y las sienes", chinese: "再见了，那因爱紧贴的手掌" },{ spanish: "que acercaba el amor. Hoy sólo tienes", chinese: "依偎的头颅。今日你唯余" },{ spanish: "la fiel memoria y los desiertos días.", chinese: "忠实的记忆和虚掷的年岁。" }] },{ sentences: [{ spanish: "Nadie pierde (repites vanamente)", chinese: "人们失去的（你空空地絮叨）" },{ spanish: "sino lo que no tiene y no ha tenido", chinese: "只是没有和不曾拥有之物" },{ spanish: "nunca, pero no basta ser valiente", chinese: "但是单凭勇气，尚不足" },{ spanish: "para aprender el arte del olvido.", chinese: "掌握遗忘这门艺术。" }] },{ sentences: [{ spanish: "Un símbolo, una rosa, te desgarra", chinese: "一种象征，一枝玫瑰令你心碎" },{ spanish: "y te puede matar una guitarra.", chinese: "吉他一弹魄散魂飞。" }] }] },
        { title: "II", paragraphs: [{ sentences: [{ spanish: "Ya no seré feliz. Tal vez no importa.", chinese: "我将不再感到幸福。也许，没有关系。" },{ spanish: "Hay tantas otras cosas en el mundo;", chinese: "这世界有太多其他的事物" },{ spanish: "un instante cualquiera es más profundo", chinese: "每一瞬都比海洋更丰富" },{ spanish: "y diverso que el mar. La vida es corta", chinese: "更深邃。朝生夕死" }] },{ sentences: [{ spanish: "y aunque las horas son tan largas, una", chinese: "时钟与之相比更漫长" },{ spanish: "oscura maravilla nos acecha,", chinese: "一种漆黑的奇迹窥视我们" },{ spanish: "la muerte, ese otro mar, esa otra flecha", chinese: "死亡，另一种海洋，另一种箭羽" },{ spanish: "que nos libra del sol y de la luna", chinese: "将我们从太阳，月亮" }] },{ sentences: [{ spanish: "y del amor. La dicha que me diste", chinese: "以及爱中解放。你给予我又剥夺的" },{ spanish: "y me quitaste debe ser borrada;", chinese: "欢愉应该被遗忘" },{ spanish: "lo que era todo tiene que ser nada.", chinese: "一切都是虚空，都是捕风。" },{ spanish: "Sólo que me queda el goce de estar triste,", chinese: "我仅存的快乐只有悲伤" }] },{ sentences: [{ spanish: "esa vana costumbre que me inclina", chinese: "只有徒劳的习惯使我倾斜" },{ spanish: "al Sur, a cierta puerta, a cierta esquina.", chinese: "向南，向某一扇门，某个角落。" }] }] }

    "镜子与面具 / El espejo y la máscara": {

        { title: "第一部分", paragraphs: [{ sentences: [{ spanish: "Cuentan que en la batalla de Clontarf...", chinese: "克朗塔夫一战..." }] }] },

        ]
      }]

  // ============================================================
  // 动态作品配置（使用单词查词模式）
  // ============================================================
  const DYNAMIC_BOOKS_CONFIG = [
    {
      name: "Cien años de soledad",
      author: "Gabriel García Márquez",
      spanishFile: "cien_anos_soledad.txt",
      chineseFile: "hundredyearsofsolitude.txt",
      mode: "word",
      format: "paired"

    {
      name: "Lazarillo de Tormes (Tratado 2)",

      chineseFile: null,
      mode: "word",
      format: "single"
    },
    {
      name: "El Buscón (Capítulo 3)",
      author: "Francisco de Quevedo",
      spanishFile: "el_buscon-capitulo3.txt",
      chineseFile: null,
      mode: "word",
      format: "single"
    }
  ];

  let dynamicBooksData = {};
  let isLoadingDynamic = {};
  let dynamicLoadError = {};
  let NOVEL_DATA = { ...STATIC_NOVEL_DATA };

  // 查词缓存
  let glossCache = {};

  // ============================================================
  // 单词本存储操作
  // ============================================================
  const STORAGE_KEY = 'vocabulary_book';
  
  function getVocabularyBook() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        return JSON.parse(stored);
      } catch(e) { return []; }
    }
    return [];
  }
  
  function saveVocabularyBook(book) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(book));
    updateVocabCountDisplay();
  }
  
  function addToVocabulary(word, definition, example, source) {
    let book = getVocabularyBook();
    const existingIndex = book.findIndex(item => item.word === word);
    const newEntry = {
      word: word,
      definition: definition,
      example: example,
      source: source,
      timestamp: Date.now()
    };
    if (existingIndex !== -1) {
      book[existingIndex] = newEntry;
    } else {
      book.push(newEntry);
    }
    saveVocabularyBook(book);
  }
  
  function updateVocabCountDisplay() {
    const countSpan = document.getElementById('vocabCount');
    if (countSpan) {
      const book = getVocabularyBook();
      countSpan.textContent = book.length;
    }
  }

  // ============================================================
  // 单词提取函数
  // ============================================================
  function getWordAtPoint(event, element) {
    try {
      let range = null;
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(event.clientX, event.clientY);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(event.clientX, event.clientY);
        if (pos) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.setEnd(pos.offsetNode, pos.offset);
        }
      }
      if (!range) return null;
      
      const textNode = range.startContainer;
      if (textNode.nodeType !== Node.TEXT_NODE) return null;
      
      const offset = range.startOffset;
      const text = textNode.textContent;
      
      let start = offset;
      let end = offset;
      
      while (start > 0 && /[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]/.test(text[start - 1])) start--;
      while (end < text.length && /[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]/.test(text[end])) end++;
      
      if (start === end) return null;
      return text.substring(start, end).toLowerCase();
    } catch (e) {
      console.warn("提取单词失败:", e);
      return null;
    }
  }

  // ============================================================
  // Google Translate API 查词
  // ============================================================
  async function lookupWordOnGlosbe(word) {
    if (glossCache[word]) return glossCache[word];
    
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(word)}`;
    
    try {
      console.log(`🔍 查词: ${word}`);
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      
      if (data && data[0] && data[0][0]) {
        const translations = data[0].map(item => item[0]).slice(0, 5);
        if (translations.length > 0) {
          glossCache[word] = translations;
          console.log(`✅ ${word} → ${translations.join(', ')}`);
          return translations;
        }
      }
      glossCache[word] = [];
      return [];
    } catch (error) {
      console.error(`❌ 查词失败 (${word}):`, error);
      return [];
    }
  }

  // ============================================================
  // 解析单语文件（每行一个段落，前两行为标题）
  // ============================================================
  async function loadSingleLanguageBook(config) {
    isLoadingDynamic[config.name] = true;
    dynamicLoadError[config.name] = null;
    
    try {
      const response = await fetch(config.spanishFile);
      if (!response.ok) throw new Error(`无法加载文件: ${response.status}`);
      const content = await response.text();
      const lines = content.split(/\r?\n/).filter(line => line.trim().length > 0);
      
      if (lines.length < 2) throw new Error("文件格式错误：需要至少两行（标题+内容）");
      
      const title = lines[0].trim();
      const paragraphs = lines.slice(1).map(line => ({ sentences: [{ spanish: line.trim(), chinese: "" }] }));
      
      const chapters = [{
        title: title,
        paragraphs: paragraphs
      }];
      
      dynamicBooksData[config.name] = {
        author: config.author,
        type: "小说",
        mode: "word",
        chapters: chapters
      };
      
      if (!readingProgress[config.name]) {
        readingProgress[config.name] = {
          completedChapters: new Array(chapters.length).fill(false),
          totalChapters: chapters.length
        };
      }
      
      isLoadingDynamic[config.name] = false;
      console.log(`✅ 加载成功: ${config.name}`);
      
    } catch (error) {
      console.error(`加载失败 ${config.name}:`, error);
      dynamicLoadError[config.name] = error;
      isLoadingDynamic[config.name] = false;
    }
  }

  // ============================================================
  // 解析双语文件（百年孤独专用）
  // ============================================================
  function parseChineseFile(content) {
    const lines = content.split(/\r?\n/);
    const chapters = [];
    let currentChapter = null;
    
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line === '' || line === null || line.trim() === '') {
        if (currentChapter && currentChapter.paragraphs.length > 0) {
          chapters.push(currentChapter);
          currentChapter = null;
        }
        continue;
      }
      if (line.trim().length > 0) {
        if (!currentChapter) {
          currentChapter = { title: `第${chapters.length + 1}章`, paragraphs: [] };
        }
        currentChapter.paragraphs.push(line.trim());
      }
    }
    if (currentChapter && currentChapter.paragraphs.length > 0) chapters.push(currentChapter);
    return chapters;
  }

  function parseSpanishFile(content) {
    const lines = content.split(/\r?\n/);
    const chapters = [];
    let currentChapter = null;
    let i = 0;
    
    while (i < lines.length) {
      const line = lines[i];
      if (line && /^\d+$/.test(line.trim())) {
        if (currentChapter && currentChapter.paragraphs.length > 0) chapters.push(currentChapter);
        currentChapter = { title: `Capítulo ${line.trim()}`, paragraphs: [] };
        i++;
        while (i < lines.length && lines[i].trim() === '') i++;
        continue;
      }
      if (line && line.trim().length > 0 && !/^\d+$/.test(line.trim())) {
        if (currentChapter) currentChapter.paragraphs.push(line.trim());
      }
      i++;
    }
    if (currentChapter && currentChapter.paragraphs.length > 0) chapters.push(currentChapter);
    return chapters;
  }

  function splitIntoSentences(text) {
    if (!text) return [];
    return text.split(/(?<=[.?!;:])|(?<=[。？！；：])/g).filter(s => s.trim().length > 0);
  }

  function mergeChapters(spanishChapters, chineseChapters) {
    const maxChapters = Math.min(spanishChapters.length, chineseChapters.length);
    const result = [];
    for (let i = 0; i < maxChapters; i++) {
      const spanishChap = spanishChapters[i];
      const chineseChap = chineseChapters[i];
      const paragraphs = [];
      const maxParas = Math.min(spanishChap.paragraphs.length, chineseChap.paragraphs.length);
      for (let j = 0; j < maxParas; j++) {
        const spanishSentences = splitIntoSentences(spanishChap.paragraphs[j]);
        const chineseSentences = splitIntoSentences(chineseChap.paragraphs[j]);
        const sentences = [];
        const maxSent = Math.min(spanishSentences.length, chineseSentences.length);
        for (let k = 0; k < maxSent; k++) {
          sentences.push({ spanish: spanishSentences[k].trim(), chinese: chineseSentences[k].trim() });
        }
        if (spanishSentences.length > maxSent) {
          for (let k = maxSent; k < spanishSentences.length; k++) {
            sentences.push({ spanish: spanishSentences[k].trim(), chinese: chineseSentences[maxSent - 1] || '（待补充翻译）' });
          }
        }
        if (sentences.length > 0) paragraphs.push({ sentences });
      }
      result.push({ title: spanishChap.title || `Capítulo ${i + 1}`, paragraphs: paragraphs });
    }
    return result;
  }

  async function loadPairedBook(config) {
    isLoadingDynamic[config.name] = true;
    dynamicLoadError[config.name] = null;
    
    try {
      const spanishResponse = await fetch(config.spanishFile);
      if (!spanishResponse.ok) throw new Error(`无法加载西语文件: ${spanishResponse.status}`);
      const chineseResponse = await fetch(config.chineseFile);
      if (!chineseResponse.ok) throw new Error(`无法加载中文文件: ${chineseResponse.status}`);
      
      const spanishChapters = parseSpanishFile(await spanishResponse.text());
      const chineseChapters = parseChineseFile(await chineseResponse.text());
      const chapters = mergeChapters(spanishChapters, chineseChapters);
      
      dynamicBooksData[config.name] = {
        author: config.author,
        type: "长篇小说",
        mode: "word",
        chapters: chapters
      };
      
      if (!readingProgress[config.name]) {
        readingProgress[config.name] = {
          completedChapters: new Array(chapters.length).fill(false),
          totalChapters: chapters.length
        };
      }
      
      isLoadingDynamic[config.name] = false;
      console.log(`✅ 加载成功: ${config.name}, 共 ${chapters.length} 章`);
    } catch (error) {
      console.error(`加载失败 ${config.name}:`, error);
      dynamicLoadError[config.name] = error;
      isLoadingDynamic[config.name] = false;
    }
  }

  // ============================================================
  // 加载所有动态作品
  // ============================================================
  async function loadAllDynamicBooks() {
    for (const config of DYNAMIC_BOOKS_CONFIG) {
      if (config.format === 'paired') {
        await loadPairedBook(config);
      } else {
        await loadSingleLanguageBook(config);
      }
    }
    // 合并到 NOVEL_DATA
    for (const [name, data] of Object.entries(dynamicBooksData)) {
      NOVEL_DATA[name] = data;
    }
    renderBookShelf();
    if (currentBookId !== "瞬息 / El instante" && NOVEL_DATA[currentBookId]) {
      renderCurrentChapter();
    }
  }

  // ============================================================
  // 渲染章节
  // ============================================================
  function renderChapterWithMode(chapter, mode, sourceBookName) {
    const container = document.createElement('div');
    container.className = `reading-area ${currentFontClass} ${currentTextSize}`;
    
    if (mode === 'word') {
      for (const para of chapter.paragraphs) {
        const pDiv = document.createElement('div');
        pDiv.className = 'paragraph';
        for (const sent of para.sentences) {
          const text = sent.spanish;
          const tokens = text.split(/([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+|[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)/g);
          for (const token of tokens) {
            if (!token) continue;
            if (/[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]/.test(token)) {
              const wordSpan = document.createElement('span');
              wordSpan.className = 'word';
              wordSpan.textContent = token;
              wordSpan.addEventListener('click', async (e) => {
                e.stopPropagation();
                const rect = wordSpan.getBoundingClientRect();
                const word = token.toLowerCase();
                const translations = await lookupWordOnGlosbe(word);
                showWordTooltip(word, translations.length ? translations : ['未找到释义'], rect, text, sourceBookName);
              });
              pDiv.appendChild(wordSpan);
            } else {
              pDiv.appendChild(document.createTextNode(token));
            }
          }
        }
        container.appendChild(pDiv);
      }
    } else {
      for (const para of chapter.paragraphs) {
        const pDiv = document.createElement('div');
        pDiv.className = 'paragraph';
        for (const sent of para.sentences) {
          const span = document.createElement('span');
          span.className = 'sentence';
          span.textContent = sent.spanish + ' ';
          span.addEventListener('click', (e) => {
            e.stopPropagation();
            showSentenceTooltip(sent.chinese, span.getBoundingClientRect());
          });
          pDiv.appendChild(span);
        }
        container.appendChild(pDiv);
      }
    }
    return container;
  }

  // ============================================================
  // 进度和状态管理
  // ============================================================
  let readingProgress = {};
  for (const [bookName, bookData] of Object.entries(STATIC_NOVEL_DATA)) {
    readingProgress[bookName] = {
      completedChapters: new Array(bookData.chapters.length).fill(false),
      totalChapters: bookData.chapters.length
    };
  }

  let currentBookId = "瞬息 / El instante";
  let currentChapterIdx = 0;
  let currentFontClass = "font-sans";
  let currentTextSize = "text-normal";

  const readingContainer = document.getElementById('readingContainer');
  const prevBtn = document.getElementById('prevChapterBtn');
  const nextBtn = document.getElementById('nextChapterBtn');
  const markBtn = document.getElementById('markChapterBtn');
  const chapterCounterSpan = document.getElementById('chapterCounter');
  const bookTitleSpan = document.getElementById('bookTitle');
  const bookAuthorSpan = document.getElementById('bookAuthor');
  const fontSwitcher = document.getElementById('fontSwitcher');
  const globalProgressBadge = document.getElementById('globalProgressBadge');
  const readingStatusMsg = document.getElementById('readingStatusMsg');
  const bookShelfList = document.getElementById('bookShelfList');

  function updateGlobalProgress() {
    const prog = readingProgress[currentBookId];
    if (!prog) return;
    const completedCount = prog.completedChapters.filter(v => v === true).length;
    const percent = Math.floor((completedCount / prog.totalChapters) * 100);
    globalProgressBadge.innerHTML = `📖 阅读进度 ${percent}% (${completedCount}/${prog.totalChapters}章)`;
  }

  function renderCurrentChapter() {
    const book = NOVEL_DATA[currentBookId];
    if (!book || !book.chapters || !book.chapters[currentChapterIdx]) {
      if (isLoadingDynamic[currentBookId]) {
        readingContainer.innerHTML = '<div class="loading-indicator">📖 正在加载，请稍候...</div>';
      } else if (dynamicLoadError[currentBookId]) {
        readingContainer.innerHTML = `<div class="loading-indicator" style="color: #c44;">⚠️ 加载失败，请确保文件已上传</div>`;
      } else {
        readingContainer.innerHTML = '<div style="text-align:center; padding:3rem;">📭 章节缺失</div>';
      }
      return;
    }
    
    const chapter = book.chapters[currentChapterIdx];
    const mode = book.mode || "sentence";
    const newContainer = renderChapterWithMode(chapter, mode, currentBookId);
    readingContainer.innerHTML = '';
    while (newContainer.firstChild) readingContainer.appendChild(newContainer.firstChild);
    readingContainer.className = `reading-area ${currentFontClass} ${currentTextSize}`;
    
    chapterCounterSpan.innerText = chapter.title || `第${currentChapterIdx+1}部分`;
    const isCompleted = readingProgress[currentBookId]?.completedChapters[currentChapterIdx] || false;
    if (isCompleted) {
      markBtn.classList.add('completed');
      markBtn.innerHTML = '✅ 本章已完成';
    } else {
      markBtn.classList.remove('completed');
      markBtn.innerHTML = '📖 标记本章读完';
    }
    readingContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateGlobalProgress();
    renderBookShelf();
  }

  function markCurrentChapterComplete() {
    const progress = readingProgress[currentBookId];
    if (!progress) return;
    if (progress.completedChapters[currentChapterIdx]) {
      readingStatusMsg.innerText = '📌 本章之前已经标记过啦！';
      setTimeout(() => readingStatusMsg.innerText = '✨ 点击单词查询释义/整句翻译', 1500);
      return;
    }
    progress.completedChapters[currentChapterIdx] = true;
    saveProgressToLocal();
    markBtn.classList.add('completed');
    markBtn.innerHTML = '✅ 本章已完成';
    readingStatusMsg.innerText = '🎉 章节进度已更新！';
    setTimeout(() => readingStatusMsg.innerText = '✨ 点击单词查询释义/整句翻译', 2000);
    updateGlobalProgress();
    renderBookShelf();
  }

  function prevChapter() {
    const book = NOVEL_DATA[currentBookId];
    if (book && currentChapterIdx > 0) { currentChapterIdx--; renderCurrentChapter(); }
    else { readingStatusMsg.innerText = '已经是第一部分'; setTimeout(() => readingStatusMsg.innerText = '✨ 点击单词查询释义/整句翻译', 800); }
  }
  
  function nextChapter() {
    const book = NOVEL_DATA[currentBookId];
    if (book && currentChapterIdx + 1 < book.chapters.length) { currentChapterIdx++; renderCurrentChapter(); }
    else { readingStatusMsg.innerText = '🎯 已是最后一部分'; setTimeout(() => readingStatusMsg.innerText = '✨ 点击单词查询释义/整句翻译', 1500); }
  }

  function switchBook(bookName) {
    if (currentBookId === bookName) return;
    currentBookId = bookName;
    currentChapterIdx = 0;
    if (!readingProgress[bookName] && NOVEL_DATA[bookName]) {
      readingProgress[bookName] = {
        completedChapters: new Array(NOVEL_DATA[bookName].chapters.length).fill(false),
        totalChapters: NOVEL_DATA[bookName].chapters.length
      };
    }
    bookTitleSpan.innerText = bookName;
    bookAuthorSpan.innerText = NOVEL_DATA[bookName]?.author || "Autor";
    renderCurrentChapter();
    updateGlobalProgress();
  }

  function saveProgressToLocal() {
    localStorage.setItem('lectura_espe_progress', JSON.stringify(readingProgress));
    localStorage.setItem('lectura_espe_last_book', currentBookId);
    localStorage.setItem('lectura_espe_last_chapter', currentChapterIdx);
    localStorage.setItem('lectura_theme', document.body.className || '');
    localStorage.setItem('lectura_font', currentFontClass);
    localStorage.setItem('lectura_text_size', currentTextSize);
  }

  function loadProgressFromLocal() {
    const saved = localStorage.getItem('lectura_espe_progress');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        for (const [bk, val] of Object.entries(parsed)) {
          if (readingProgress[bk]) readingProgress[bk].completedChapters = val.completedChapters;
        }
      } catch(e) {}
    }
    const lastBook = localStorage.getItem('lectura_espe_last_book');
    if (lastBook && (STATIC_NOVEL_DATA[lastBook] || dynamicBooksData[lastBook])) {
      currentBookId = lastBook;
      const lastChap = parseInt(localStorage.getItem('lectura_espe_last_chapter'));
      if (!isNaN(lastChap)) currentChapterIdx = lastChap;
    }
    // 加载主题
    const savedTheme = localStorage.getItem('lectura_theme');
    if (savedTheme) document.body.className = savedTheme;
    // 加载字体
    const savedFont = localStorage.getItem('lectura_font');
    if (savedFont && savedFont !== currentFontClass) {
      currentFontClass = savedFont;
      fontSwitcher.value = savedFont;
    }
    // 加载字号
    const savedSize = localStorage.getItem('lectura_text_size');
    if (savedSize && ['text-small', 'text-normal', 'text-large'].includes(savedSize)) {
      currentTextSize = savedSize;
    }
  }

  function renderBookShelf() {
    const grouped = {};
    for (const [bookName, bookData] of Object.entries(NOVEL_DATA)) {
      const author = bookData.author;
      if (!grouped[author]) grouped[author] = [];
      grouped[author].push({ name: bookName, data: bookData });
    }
    bookShelfList.innerHTML = '';
    for (const [author, works] of Object.entries(grouped)) {
      let authorCompleted = 0, authorTotal = 0;
      for (const w of works) {
        const prog = readingProgress[w.name];
        authorCompleted += prog ? prog.completedChapters.filter(c=>c===true).length : 0;
        authorTotal += prog ? prog.totalChapters : 0;
      }
      const percent = authorTotal ? Math.floor((authorCompleted/authorTotal)*100) : 0;
      const groupDiv = document.createElement('div');
      groupDiv.className = 'author-group';
      groupDiv.innerHTML = `
        <div class="author-group-header">
          <span class="toggle-icon">▼</span>
          <h3>${author}</h3>
          <span class="group-progress">${percent}% · ${authorCompleted}/${authorTotal}</span>
        </div>
        <div class="author-works"></div>
      `;
      const worksContainer = groupDiv.querySelector('.author-works');
      for (const w of works) {
        const prog = readingProgress[w.name];
        const completedCount = prog ? prog.completedChapters.filter(c=>c===true).length : 0;
        const totalCh = w.data.chapters.length;
        const allRead = completedCount === totalCh;
        const card = document.createElement('div');
        card.className = `book-card ${allRead ? 'read-status' : ''}`;
        card.innerHTML = `<span class="status-dot"></span><span>${w.name}</span><span style="font-size:0.7rem;">${completedCount}/${totalCh}</span>${allRead ? ' ✨' : ''}`;
        card.addEventListener('click', () => switchBook(w.name));
        worksContainer.appendChild(card);
      }
      const header = groupDiv.querySelector('.author-group-header');
      let collapsed = false;
      header.addEventListener('click', () => {
        collapsed = !collapsed;
        worksContainer.style.display = collapsed ? 'none' : 'flex';
        header.querySelector('.toggle-icon').innerHTML = collapsed ? '▶' : '▼';
      });
      bookShelfList.appendChild(groupDiv);
    }
  }

  function setFontClass(className) { currentFontClass = className; renderCurrentChapter(); saveProgressToLocal(); }
  function setTextSize(size) { currentTextSize = size; renderCurrentChapter(); saveProgressToLocal(); }
  function setTheme(themeName) { document.body.className = themeName === 'default' ? '' : `theme-${themeName}`; saveProgressToLocal(); }

  fontSwitcher.addEventListener('change', (e) => setFontClass(e.target.value));
  document.getElementById('textSmallBtn')?.addEventListener('click', () => setTextSize('text-small'));
  document.getElementById('textNormalBtn')?.addEventListener('click', () => setTextSize('text-normal'));
  document.getElementById('textLargeBtn')?.addEventListener('click', () => setTextSize('text-large'));
  document.getElementById('themeDefaultBtn')?.addEventListener('click', () => setTheme('default'));
  document.getElementById('themeBlueBtn')?.addEventListener('click', () => setTheme('blue'));
  document.getElementById('themeTerracottaBtn')?.addEventListener('click', () => setTheme('terracotta'));
  prevBtn.addEventListener('click', prevChapter);
  nextBtn.addEventListener('click', nextChapter);
  markBtn.addEventListener('click', markCurrentChapterComplete);
  
  loadProgressFromLocal();
  bookTitleSpan.innerText = currentBookId;
  bookAuthorSpan.innerText = STATIC_NOVEL_DATA[currentBookId]?.author || dynamicBooksData[currentBookId]?.author || "Jorge Luis Borges";
  
  loadAllDynamicBooks().then(() => {
    renderCurrentChapter();
    renderBookShelf();
    updateGlobalProgress();
    updateVocabCountDisplay();
  });
  
  window.addEventListener('beforeunload', () => saveProgressToLocal());
</script>
</body>
</html>
